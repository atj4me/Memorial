<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<meta name="description" content="Starbound — a private sky for the words you still need to say. Name a star for those you miss, or for yourself — everything stays on your device.">
<title>Starbound — letters to the stars</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
  // First-paint routing: the browser may paint before app.js runs, so decide
  // here which view the URL wants and hide the other one immediately.
  (function () {
    try {
      var m = location.hash.match(/^#\/space\/(.+)$/);
      document.documentElement.className += m ? ' boot-space' : ' boot-spaces';
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="styles.css?v=19">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">✨</span>
    <span class="brand-name">Starbound</span>
  </div>
  <div class="top-actions">
    <button id="btn-stats" class="btn btn-ghost btn-icon" type="button" aria-label="Your sky in numbers">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="13" x2="3" y2="8"/><line x1="8" y1="13" x2="8" y2="4"/><line x1="13" y1="13" x2="13" y2="10"/>
      </svg>
    </button>
    <button id="btn-export" class="btn btn-ghost" type="button">Backup</button>
    <button id="btn-import" class="btn btn-ghost" type="button">Restore</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>
</header>

<p class="privacy-note" id="privacy-note">
  <span aria-hidden="true">🔒</span>
  Private by design — everything you write or upload stays in this browser, on this device. Nothing is ever sent anywhere.
  <button type="button" id="privacy-dismiss" class="privacy-dismiss" aria-label="Dismiss">✕</button>
</p>

<!-- ============ HOME: MAP + LIST ============ -->
<main id="view-spaces" class="view view-home">
  <div class="view-toggle home-toggle" role="tablist" aria-label="Choose view">
    <button id="tab-map" class="view-tab active" role="tab" aria-selected="true" type="button">Map</button>
    <button id="tab-list" class="view-tab" role="tab" aria-selected="false" type="button">List</button>
  </div>
  <section id="home-map" class="home-map" aria-label="Sky map">
    <canvas id="mapview-canvas"></canvas>
    <div class="map-controls">
      <button id="map-zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="map-zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="map-recenter" type="button" aria-label="Go to my stars">⌂</button>
    </div>
    <p class="map-hint" id="map-hint">Drag to explore the sky · tap a star to claim it</p>
    <button id="btn-new-space-fab" class="map-fab" type="button" aria-label="Name a new star">+</button>
  </section>
  <section id="home-list" class="home-list" hidden aria-label="Star list">
    <div id="list-rows"></div>
    <button id="btn-new-space" class="btn btn-primary btn-new-space" type="button">+ New star</button>
  </section>
</main>

<!-- ============ STAR DETAIL ============ -->
<main id="view-space" class="view" hidden>
  <button id="btn-back" class="btn btn-ghost btn-back" type="button">← All stars</button>

  <section class="space-hero">
    <img id="space-photo" class="space-photo" alt="" hidden>
    <div class="space-hero-text">
      <h1 id="space-name"></h1>
      <p id="space-dates" class="space-dates"></p>
      <p id="space-dedication" class="space-dedication"></p>
    </div>
    <div class="space-hero-actions">
      <button id="btn-edit-space" class="btn btn-ghost" type="button">Edit</button>
      <button id="btn-delete-space" class="btn btn-danger-ghost" type="button">Destroy</button>
    </div>
  </section>

  <section id="timeline" class="timeline" aria-live="polite"></section>
  <p id="timeline-empty" class="empty-sub center" hidden>Nothing here yet — write the first one below.</p>

  <section class="composer" aria-label="New message">
    <div id="pending" class="pending"></div>
    <label class="sr-only" for="composer-text">Write a message</label>
    <textarea id="composer-text" rows="2" placeholder="Write…"></textarea>
    <div class="composer-row">
      <button id="btn-attach-photo" class="btn btn-icon" type="button" title="Attach a photo" aria-label="Attach a photo">📷</button>
      <button id="btn-attach-video" class="btn btn-icon" type="button" title="Attach a video" aria-label="Attach a video">🎬</button>
      <button id="btn-record" class="btn btn-icon" type="button" title="Record a voice note" aria-label="Record a voice note">🎙️</button>
      <button id="btn-send" class="btn btn-primary" type="button">Send</button>
    </div>
    <div id="recorder" class="recorder" hidden>
      <span class="rec-dot" aria-hidden="true"></span>
      <span id="rec-time">0:00</span>
      <button id="btn-stop-rec" class="btn btn-danger" type="button">Stop</button>
    </div>
    <input type="file" id="file-photo" accept="image/*" hidden>
    <input type="file" id="file-video" accept="video/*" hidden>
  </section>
</main>

<!-- ============ STAR DIALOG ============ -->
<dialog id="space-dialog">
  <form id="space-form" method="dialog">
    <h2 id="space-dialog-title">New star</h2>
    <label class="field">
      <span>Name *</span>
      <input id="f-name" type="text" required maxlength="80" autocomplete="off" placeholder="e.g. Ammachi, or “Morning pages”">
    </label>
    <label class="field">
      <span>Photo</span>
      <input id="f-photo" type="file" accept="image/*">
    </label>
    <div class="field-row">
      <label class="field">
        <span>Dates</span>
        <input id="f-dates" type="text" maxlength="40" autocomplete="off" placeholder="e.g. 1940 – 2020">
      </label>
    </div>
    <label class="field">
      <span>About this star</span>
      <input id="f-dedication" type="text" maxlength="140" autocomplete="off" placeholder="e.g. Letters I never sent">
    </label>
    <div class="dialog-actions">
      <button type="button" id="btn-cancel-space" class="btn btn-ghost">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<script src="vendor/sweetalert2.min.js?v=1"></script>
<script src="app.js?v=26"></script>
</body>
</html>
